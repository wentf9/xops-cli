# =============================================================================
# XOps Playbook v2 示例 — Web 应用部署
# 校验: xops playbook validate examples/playbooks/deploy-web.yaml --json
# 运行: xops playbook run examples/playbooks/deploy-web.yaml --var app_version=2.1.0 --concurrency 3
# 完整 Schema 参考: docs/guide/automation.md
# =============================================================================
version: 2
id: deploy-web
name: "Deploy Web Application"
description: "Install nginx, render config, copy release manifest, and verify deployment"
on_error: fail_fast # fail_fast | continue | abort

# 目标节点选择器（支持 tags / nodes / exclude_nodes）
target:
  tags: [web, prod]
  exclude_nodes: [web-maint-01]

# 模板变量（可通过 CLI --var key=value 覆写）
vars:
  app_version: "2.0.0"
  app_port: "8080"
  env_name: "prod"

# 声明式步骤列表（action.kind 支持 ensure | template | copy | script | shell）
steps:
  - id: ensure-nginx
    name: "Ensure nginx package is installed"
    action:
      kind: ensure
      check:
        kind: shell
        command: "command -v nginx >/dev/null 2>&1"
      action:
        kind: shell
        command: "apt-get update && apt-get install -y nginx"
        timeout: 3m
      max_retries: 1

  - id: upload-conf
    name: "Render and atomically publish nginx config"
    action:
      kind: template
      source: "./templates/nginx.conf.tmpl"
      dest: "/etc/nginx/conf.d/app.conf"
      vars:
        listen_port: "8080"
      mode: "0644"
      overwrite: true
      atomic: true

  - id: copy-manifest
    name: "Copy release manifest"
    when_tags: [web]
    action:
      kind: copy
      source: "./manifest.json"
      dest: "/srv/www/manifest.json"
      mode: "0644"
      overwrite: true
      atomic: true

  - id: reload-nginx
    name: "Reload nginx service"
    action:
      kind: shell
      command: "nginx -t && systemctl reload nginx"
      timeout: 30s

  - id: verify-script
    name: "Run post-deploy check script"
    on_error: continue
    action:
      kind: script
      source: "./scripts/verify.sh"
      args: ["--strict"]
      work_dir: "/srv/www"
      env:
        APP_ENV: "prod"
      timeout: 30s
