name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run with tmate SSH session on failure'
        required: false
        default: false

permissions:
  contents: read

env:
  # Credential/KDF helpers re-exec race binaries; retain race detection without
  # the default one-second shutdown sleep on every helper invocation.
  GORACE: atexit_sleep_ms=0

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.changes.outputs.code }}
      core: ${{ steps.changes.outputs.core }}
      cross_platform: ${{ steps.changes.outputs.cross_platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: changes
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_BEFORE_SHA: ${{ github.event.before }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: python3 scripts/ci_changes.py >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: go.sum

      - name: golangci-lint
        if: steps.changes.outputs.code == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
          args: ./...

  test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: changes
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_BEFORE_SHA: ${{ github.event.before }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: python3 scripts/ci_changes.py >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: go.sum

      - name: Verify dependencies
        if: steps.changes.outputs.code == 'true'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Install native Unix shell test dependencies
        if: steps.changes.outputs.code == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fish zsh

      - name: Build all packages
        if: steps.changes.outputs.code == 'true'
        run: go build ./...

      - name: Verify shared core isolation
        if: steps.changes.outputs.code == 'true'
        run: |
          python3 -m unittest discover -s scripts -p test_check_core.py
          python3 -m unittest discover -s scripts -p test_ci_changes.py
          if [ "${{ steps.changes.outputs.core }}" = "true" ]; then
            python3 scripts/check_core.py
          else
            python3 scripts/check_core.py --graph-only
          fi

      - name: Run tests
        if: steps.changes.outputs.code == 'true'
        run: go test -race -shuffle=on -count=1 ./...

      - name: Run native password sudo PTY regression
        if: steps.changes.outputs.code == 'true'
        env:
          XOPS_TEST_NATIVE_SUDO_PASSWORD: public-ci-sudo-password
        run: |
          go test -race -c -o /tmp/xops-sudo-ci.test ./core/ssh
          sudo useradd --create-home --shell /bin/bash xops-sudo-ci
          trap 'sudo rm -f /etc/sudoers.d/xops-sudo-ci /tmp/xops-sudo-ci.test; sudo userdel --remove xops-sudo-ci' EXIT
          printf 'xops-sudo-ci:%s\n' "$XOPS_TEST_NATIVE_SUDO_PASSWORD" | sudo chpasswd
          printf '%s\n' 'Defaults:xops-sudo-ci timestamp_timeout=0' 'xops-sudo-ci ALL=(root) PASSWD: ALL' | sudo tee /etc/sudoers.d/xops-sudo-ci >/dev/null
          sudo chmod 440 /etc/sudoers.d/xops-sudo-ci
          sudo -u xops-sudo-ci env XOPS_TEST_NATIVE_SUDO_PASSWORD="$XOPS_TEST_NATIVE_SUDO_PASSWORD" /tmp/xops-sudo-ci.test -test.run '^TestPrivilegeNativePasswordSudoPTY$' -test.count=1 -test.timeout=30s -test.v

      - name: Run offline credential business integration tests
        if: steps.changes.outputs.code == 'true'
        env:
          GORACE: atexit_sleep_ms=0
        run: |
          umask 077
          go test -tags=integration -race -shuffle=on -count=1 -timeout=120s \
            -run '^(TestEncrypted|TestOffline)' ./pkg/config ./cmd

  windows-test:
    name: Windows Build and Test
    needs: lint
    if: needs.lint.outputs.cross_platform == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: go.sum

      - name: Build all packages
        run: go build ./...

      - name: Run native Windows Make without sh.exe
        shell: pwsh
        timeout-minutes: 3
        run: |
          $makeExecutable = (Get-Command make -ErrorAction Stop).Source
          $env:PATH = (($env:PATH -split ';') | Where-Object {
            $_ -and -not (Test-Path (Join-Path $_ 'sh.exe'))
          }) -join ';'
          Remove-Item Env:SHELL, Env:MAKESHELL -ErrorAction SilentlyContinue
          & $makeExecutable help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $makeExecutable 'DATE=2026-09-14 12:00:00'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $makeExecutable clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run native Windows shell probe regressions
        run: go test -race -parallel 1 -shuffle=on -count=1 ./core/ssh -run '^TestProbeShell'

      - name: Run Windows tests (PR fast path)
        if: github.event_name == 'pull_request'
        run: go test -shuffle=on -count=1 ./... -skip '^TestProbeShell'

      - name: Run Windows race tests on platform-critical packages
        if: github.event_name == 'pull_request'
        run: go test -race -shuffle=on -count=1 ./internal/terminal ./internal/sshenv ./internal/credentialfile/... ./internal/vaultsys/... ./internal/credentialhelper ./cmd/sftpshell

      - name: Run Windows tests (full race suite)
        if: github.event_name != 'pull_request'
        run: go test -race -shuffle=on -count=1 ./... -skip '^TestProbeShell'

      - name: Run Windows ConPTY integration regressions
        if: ${{ !cancelled() }}
        run: go test -race -tags=integration -run '^TestWindows(LineEditorConPTY|InteractiveInputConPTY|ConPTYOutputClosedHandle|OutputConPTYFallback)$' -count=1 -timeout=120s ./cmd/sftpshell ./internal/terminal ./core/ssh

  macos-test:
    name: macOS Build and Test
    needs: lint
    if: needs.lint.outputs.cross_platform == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: go.sum

      - name: Build all packages
        run: go build ./...

      - name: Set up macOS Keychain
        run: |
          KEYCHAIN_PATH="$HOME/Library/Keychains/ci.keychain-db"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Run macOS tests
        run: go test -race -shuffle=on -count=1 ./...

      - name: Run Native Platform Verification Script
        run: ./scripts/verify_native_platform.sh

      - name: Clean up macOS Keychain
        if: always()
        run: |
          security delete-keychain "$HOME/Library/Keychains/ci.keychain-db" || true

      - name: Setup tmate debug session on failure
        if: ${{ failure() && github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        uses: mxschmitt/action-tmate@v3
