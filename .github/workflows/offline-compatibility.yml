name: Offline vault native compatibility

on:
  push:
    branches: [work/offline-vault-compatibility]
  pull_request:
    paths:
      - '.gitattributes'
      - 'pkg/ssh/**'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/credential*.go'
      - 'cmd/cli/**'
      - 'internal/credentialfile/**'
      - 'internal/vaultsys/**'
      - 'internal/kdfhelper/**'
      - 'scripts/offline-platform-verify/**'
      - '.github/workflows/offline-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { os: ubuntu-24.04, arch: amd64, race: '-race' }
          - { os: ubuntu-24.04-arm, arch: arm64, race: '-race' }
          - { os: windows-latest, arch: amd64, race: '-race' }
          - { os: windows-11-arm, arch: arm64, race: '' }
          - { os: macos-15, arch: arm64, race: '-race' }
          - { os: macos-15-intel, arch: amd64, race: '-race' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      RACE_FLAGS: ${{ matrix.race }}
    steps:
      - uses: actions/checkout@v7
      - name: Exercise Windows CRLF checkout of frozen vectors
        if: runner.os == 'Windows'
        run: |
          git config core.autocrlf true
          git checkout-index --force internal/credentialfile/format/testdata/vectors.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          architecture: ${{ matrix.arch }}
      - name: Report native platform
        run: go env GOOS GOARCH CGO_ENABLED
      - name: Build
        run: go build ./...
      - name: Full native shuffled tests
        run: go test ${{ env.RACE_FLAGS }} -parallel 2 -shuffle=on ./...
      - name: Native vault and real KDF helper (release configuration)
        env:
          CGO_ENABLED: '0'
        run: go run ./scripts/offline-platform-verify
      - name: Native operations and process-crash recovery
        run: go test ${{ env.RACE_FLAGS }} -parallel 2 -count=1 -tags=integration ./internal/credentialfile/...
