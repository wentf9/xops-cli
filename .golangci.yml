version: "2"
run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - ineffassign
    - misspell
    - copyloopvar
    - errorlint
    - unconvert
    - govet
    - staticcheck
    - unused
    - gocyclo
    - forbidigo
    - depguard
  settings:
    gocyclo:
      min-complexity: 20
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^os\.(Open|OpenFile|ReadFile|Remove|RemoveAll)$'
          pkg: '^os$'
          msg: 'use core/fsx handle-based primitives (OpenRegular/ReadAllBounded/CreateExclusive/OpenLocked/AtomicReplace) outside core/fsx, or justify with //nolint:forbidigo // <reason>'
        - pattern: '^(syscall|unix)\.Flock$'
          pkg: '^(syscall|golang\.org/x/sys/unix)$'
          msg: 'use core/fsx.OpenLocked/TryOpenLocked/OpenLockedContext/TryLockFile instead of raw Flock'
        - pattern: '^windows\.(GetNamedSecurityInfo|SetNamedSecurityInfo)$'
          pkg: '^golang\.org/x/sys/windows$'
          msg: 'use handle-based windows.GetSecurityInfo/SetSecurityInfo via core/winsec instead of path-based GetNamedSecurityInfo/SetNamedSecurityInfo'
        - pattern: '^filepath\.Base$'
          pkg: '^path/filepath$'
          msg: 'in transfer code use core/sftp.RemotePath.Base() for remote paths or core/sftp.LocalBaseName() for local OS paths'
    depguard:
      rules:
        core-decoupling:
          files:
            - "**/core/**/*.go"
          deny:
            - pkg: "github.com/wentf9/xops-cli/cmd"
              desc: "core/** must not depend on cmd/**"
            - pkg: "github.com/wentf9/xops-cli/pkg"
              desc: "core/** must not depend on pkg/**"
            - pkg: "github.com/wentf9/xops-cli/internal"
              desc: "core/** must not depend on internal/**"
  exclusions:
    rules:
      - path: "_test\\.go"
        linters:
          - errcheck
        source: "<-"
      - path: "_test\\.go$"
        linters:
          - forbidigo
      - path: "^core/fsx/"
        linters:
          - forbidigo
      - path-except: "^(core/sftp/|cmd/sftpshell/|cmd/scp[^/]*\\.go$)"
        linters:
          - forbidigo
        text: "filepath\\.Base"

formatters:
  # Enable specific formatter.
  # Default: [] (uses standard Go formatting)
  enable:
    - gofmt