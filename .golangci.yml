version: "2"
run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - ineffassign
    - misspell
    - copyloopvar
    - errorlint
    - unconvert
    - govet
    - staticcheck
    - unused
    - gocognit
    - depguard
  settings:
    gocognit:
      min-complexity: 15
    depguard:
      rules:
        core-decoupling:
          files:
            - "**/core/**/*.go"
          deny:
            - pkg: "github.com/wentf9/xops-cli/cmd"
              desc: "core/** must not depend on cmd/**"
            - pkg: "github.com/wentf9/xops-cli/internal"
              desc: "core/** must not depend on internal/**"
        entry-decoupling:
          files:
            - "**/internal/entry/**/*.go"
          deny:
            - pkg: "github.com/wentf9/xops-cli/internal/host"
              desc: "internal/entry/** must not depend on internal/host/**"
            - pkg: "github.com/wentf9/xops-cli/core/osfs"
              desc: "internal/entry/** must not depend on core/osfs"
        host-decoupling:
          files:
            - "**/internal/host/**/*.go"
          deny:
            - pkg: "github.com/wentf9/xops-cli/core/engine"
              desc: "internal/host/** must not depend on core/engine"
            - pkg: "github.com/wentf9/xops-cli/internal/entry"
              desc: "internal/host/** must not depend on internal/entry/**"
        i18n-decoupling:
          files:
            - "**/internal/i18n/**/*.go"
          deny:
            - pkg: "github.com/wentf9/xops-cli/cmd"
              desc: "internal/i18n/** must not depend on cmd/**"
            - pkg: "github.com/wentf9/xops-cli/internal/host"
              desc: "internal/i18n/** must not depend on internal/host/**"
            - pkg: "github.com/wentf9/xops-cli/internal/entry"
              desc: "internal/i18n/** must not depend on internal/entry/**"
            - pkg: "github.com/wentf9/xops-cli/core/engine"
              desc: "internal/i18n/** must not depend on core/engine"
            - pkg: "github.com/wentf9/xops-cli/core/osfs"
              desc: "internal/i18n/** must not depend on core/osfs"
            - pkg: "github.com/wentf9/xops-cli/core/ports"
              desc: "internal/i18n/** must not depend on core/ports/**"
            - pkg: "github.com/wentf9/xops-cli/core/events"
              desc: "internal/i18n/** must not depend on core/events"
            - pkg: "github.com/wentf9/xops-cli/core/internal"
              desc: "internal/i18n/** must not depend on core/internal/**"
  exclusions:
    rules:
      - path: "_test\\.go"
        linters:
          - errcheck
        source: "<-"

formatters:
  enable:
    - gofmt
