tui.hosts.empty: "  （暂无已加载主机；按 'r' 刷新资产或调整过滤条件）"
tui.stream.idle: "空闲"
tui.stream.streaming: "流式传输中"
tui.metrics.title: "主机指标 [{state}] 目标={target} 排序={sort}"
tui.metrics.empty: "  （暂无指标采样；在主机列表按 'm' 启动实时指标流）"
tui.metrics.frame_summary: "  主机：{host} ({node})  CPU：{cpu}%  负载：{load1} {load5} {load15}  内存：{mem_pct}% ({mem_used}/{mem_total} B)  运行时长：{uptime}"
tui.metrics.disks: "  磁盘占用："
tui.metrics.top_processes: "  热门进程："
tui.logs.title: "实时日志 [{state}] 目标={target} 行数={lines}"
tui.logs.empty: "  （暂无日志条目；在主机列表按 'l' 启动实时日志流）"
tui.logs.truncated: "[已截断]"
tui.ops.title: "操作（{ops}）| 连接池（{pool}）| 诊断（{diags}）"
tui.ops.empty: "  （暂无操作或系统事件记录）"
tui.ops.status.running: "运行中"
tui.ops.status.ok: "成功"
tui.ops.status.failed: "失败"
tui.ops.status.unknown: "未知"
tui.help.title: "快捷键与运行期控制"
tui.help.body: |-
    1-4 / ? / Tab / Shift+Tab : 切换工作台视图（主机、指标、日志、操作、帮助）
    j/k 或 Up/Down / g / G    : 移动主机光标或滚动日志
    /                         : 过滤当前视图（Enter 应用，Esc 清除）
    r                         : 从引擎刷新资产快照
    m / l / x                 : 启动指标流 / 启动日志流（小写 l）/ 停止活跃流
    s                         : 切换进程排序方式（CPU / 内存）
    L                         : 切换界面语言（英文 / 简体中文，大写 L）
    Enter（主机视图）          : 触发受监督交互式终端接管（若已配置）
    q / Ctrl+C                : 优雅退出并恢复终端状态
tui.footer.err_prefix: "错误：{err}"
tui.footer.help: "快捷键: 1-4/? 视图 | / 过滤 | r 刷新 | m 指标 | l 日志 | x 停止 | L 语言 | q 退出"
tui.sort.cpu: "CPU"
tui.sort.mem: "内存"
tui.lang.en: "English"
tui.lang.zh: "简体中文"

