    --allow-non-loopback       允许在非回环网卡上绑定 HTTP 监听
    --allowed-origin <origin>  允许的 HTTP Origin 请求头（可重复指定）
    --allowed-host <host>      允许的 HTTP Host 请求头（可重复指定）
    -F, --ssh-config <file>    指定替代的 OpenSSH 配置文件
    --policy <profile>         安全策略配置档：direct_operator | strict_operator | strict_agent
    --lang <zh|en>             界面语言：zh | en
    -h, --help                 显示此帮助信息

