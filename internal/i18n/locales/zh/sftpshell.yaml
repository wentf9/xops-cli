sftpshell.output.stat: |-
  路径：{path}
  类型：{type}
  权限：{mode} ({perm})
  大小：{size}
  修改时间：{mtime}
  文件锚点：{anchor}
sftpshell.output.uploaded: "已上传 {src} -> {dest}（{files} 个文件，{bytes} 字节）"
sftpshell.output.downloaded: "已下载 {src} -> {dest}（{files} 个文件，{bytes} 字节）"
sftpshell.output.wrote: "已写入 {path}（{bytes} 字节）"
sftpshell.output.progress: "sftp: 进度 [{stage}] {transferred}/{total} 字节"

sftpshell.help.summary: |
  SFTP Shell 交互命令：
    目录导航：
      pwd                         显示当前远端工作目录
      cd [远端路径]               切换远端工作目录（默认返回初始远端目录）
      ls [-l] [-a] [远端路径]     列举远端目录内容
      lpwd                        显示当前本地工作目录
      lcd <本地路径>              切换本地工作目录
      lls [-l] [-a] [本地路径]    列举本地目录内容（需注入 LocalFS）

    文件传输与原子操作：
      put [-r] [-n] [--resume] [-p] <本地> [远端]  上传本地文件或目录至远端
      get [-r] [-n] [--resume] [-p] <远端> [本地]  从远端下载文件或目录至本地
      cat <远端路径>                               读取远端文件内容
      write [-n] [-p] <远端路径> <文本内容>        原子写入文本至远端文件
      mv [-n] <旧路径> <新路径>                    原子重命名远端路径（别名：rename）
      mkdir [-m <八进制权限>] <远端路径>           递归创建远端目录
      rm <远端路径>                                删除远端文件或符号链接
      rmdir <远端路径>                             删除远端空目录

    元数据与探测：
      chmod <八进制权限> <远端路径>                修改远端文件权限（0001..0777）
      chtimes <mtime> <远端路径>                   更新远端访问/修改时间（或 <atime> <mtime> <路径>）
      stat [-L] <远端路径>                         查看远端元数据与 FSTAT 锚点（默认跟随软链）
      lstat <远端路径>                             查看远端元数据（不跟随软链）
      realpath <远端路径>                          解析远端规范绝对路径
      readlink <远端路径>                          读取远端符号链接目标

    控制：
      help [命令]                 显示帮助信息
      exit / quit / bye           退出 SFTP Shell

sftpshell.help.put: "put [-r] [-n|--no-clobber] [--resume] [-p|--preserve] <本地路径> [远端路径]：经 SCPUpload 上传并流式汇报进度"
sftpshell.help.get: "get [-r] [-n|--no-clobber] [--resume] [-p|--preserve] <远端路径> [本地路径]：经 SCPDownload 下载至受控本地目录"
sftpshell.help.mv: "mv [-n|--no-clobber] <旧路径> <新路径>：执行 SFTP v3 posix-rename@openssh.com 原子重命名"
sftpshell.help.chmod: "chmod <八进制权限> <远端路径>：设置 POSIX 权限位（0001..0777）"
sftpshell.help.chtimes: "chtimes <mtime> <远端路径> | chtimes <atime> <mtime> <远端路径>：设置 RFC3339 或 Unix 秒级时间戳"
sftpshell.help.write: "write [-n|--no-clobber] [-p|--parents] <远端路径> <文本>：原子写入 UTF-8 文本至远端文件"
sftpshell.help.stat: "stat [-L|--follow] <远端路径>：查看远端元数据与 FSTAT 锚点（默认跟随软链）"
sftpshell.help.lstat: "lstat <远端路径>：查看远端元数据与 FSTAT 锚点（不跟随软链，传 -L 可跟随）"
