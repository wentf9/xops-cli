tui.ops.status.failed: "FAILED"
tui.ops.status.unknown: "UNKNOWN"
tui.help.title: "Keybindings & Runtime Controls"
tui.help.body: |-
    1-4 / ? / Tab / Shift+Tab : Switch workbench views (Hosts, Metrics, Logs, Operations, Help)
    j/k or Up/Down / g / G    : Navigate host selection or scroll logs
    /                         : Filter current view (Enter apply, Esc clear)
    r                         : Refresh inventory snapshot from Engine
    m / l / x                 : Start Metrics stream / Start Log stream (lowercase l) / Stop active streams
    s                         : Toggle process sort order (CPU / Mem)
    L                         : Switch display language (English / Chinese, uppercase L)
    Enter (Hosts view)        : Trigger supervised interactive terminal takeover (if wired)
    q / Ctrl+C                : Quit cleanly and restore terminal state
tui.footer.err_prefix: "ERR: {err}"
tui.footer.help: "keys: 1-4/? views | / filter | r refresh | m metrics | l logs | x stop | L lang | q quit"
tui.sort.cpu: "cpu"
tui.sort.mem: "mem"
tui.lang.en: "English"
tui.lang.zh: "Chinese"

