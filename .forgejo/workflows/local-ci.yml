name: XOps v2 Local Multi-Platform CI

on:
  push:
    branches: ['refactor/v2-architecture', 'master']
  workflow_dispatch:
    inputs:
      dst_seeds:
        description: 'DST seed count (default 2000 for push, 10000 for Gate)'
        default: '2000'
      run_bsd:
        description: 'Run FreeBSD native verification'
        type: boolean
        default: true
      run_ubuntu:
        description: 'Run Ubuntu native verification'
        type: boolean
        default: true

env:
  GORACE: atexit_sleep_ms=0

jobs:
  linux-fast:
    runs-on: linux-fast
    steps:
      - name: Checkout repository (pure git via Forgejo server URL)
        run: |
          set -eu
          SERVER_URL="${GITHUB_SERVER_URL%/}"
          AUTH_URL="$(printf '%s' "$SERVER_URL" | sed -E "s#(https?://)#\\1x-access-token:${GITHUB_TOKEN}@#")"
          trap 'git remote set-url origin "${SERVER_URL}/${GITHUB_REPOSITORY}.git" 2>/dev/null || true' EXIT
          rm -rf .git
          git init -q .
          git remote add origin "${AUTH_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout -qf FETCH_HEAD
          git clean -ffdx
      - name: Verify toolchain, CI scripts & docs
        run: |
          set -eu
          go version
          golangci-lint --version
          if command -v python3 >/dev/null 2>&1; then
            python3 -m unittest discover -s scripts -p test_ci_changes.py -v
          fi
          if [ -f package.json ] && command -v npm >/dev/null 2>&1; then
            npm run docs:check
          fi
      - name: Verify xopsvet, core/, and root CLI (verify.go)
        run: |
          set -eu
          go run ./scripts/ci/verify.go --stage=all
      - name: Cross-compile & cross-lint (Windows & macOS)
        run: |
          set -eu
          go run ./scripts/ci/verify.go --stage=cross
      - name: Run Deterministic Simulation Tests (DST)
        run: |
          set -eu
          go run ./scripts/ci/verify.go --stage=dst --dst-seeds="${{ inputs.dst_seeds || '2000' }}"

  windows-native:
    needs: linux-fast
    runs-on: windows-native
    steps:
      - name: Checkout repository (pure git via Forgejo server URL)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $serverUrl = $env:GITHUB_SERVER_URL.TrimEnd('/')
          $authUrl = $serverUrl -replace '^(https?://)', "`$1x-access-token:$($env:GITHUB_TOKEN)@"
          try {
            if (Test-Path .git) { Remove-Item -Recurse -Force .git }
            git init -q .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git remote add origin "$authUrl/$($env:GITHUB_REPOSITORY).git"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git fetch --depth 1 origin $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git checkout -qf FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git clean -ffdx
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            git remote set-url origin "$serverUrl/$($env:GITHUB_REPOSITORY).git" 2>$null
          }
      - name: Run native Windows Make without sh.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $makeExecutable = (Get-Command make -ErrorAction Stop).Source
          $env:PATH = (($env:PATH -split ';') | Where-Object {
            $_ -and -not (Test-Path (Join-Path $_ 'sh.exe'))
          }) -join ';'
          Remove-Item Env:SHELL, Env:MAKESHELL -ErrorAction SilentlyContinue
          & $makeExecutable help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $makeExecutable 'DATE=2026-09-14 12:00:00'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $makeExecutable clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Windows verification (verify.go)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go version
          golangci-lint --version
          gcc --version | Select-Object -First 1
          make --version | Select-Object -First 1
          go run ./scripts/ci/verify.go --stage=all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  ubuntu-native:
    needs: linux-fast
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_ubuntu }}
    runs-on: ubuntu-native
    steps:
      - name: Checkout repository (pure git via Forgejo server URL)
        run: |
          set -eu
          SERVER_URL="${GITHUB_SERVER_URL%/}"
          AUTH_URL="$(printf '%s' "$SERVER_URL" | sed -E "s#(https?://)#\\1x-access-token:${GITHUB_TOKEN}@#")"
          trap 'git remote set-url origin "${SERVER_URL}/${GITHUB_REPOSITORY}.git" 2>/dev/null || true' EXIT
          rm -rf .git
          git init -q .
          git remote add origin "${AUTH_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout -qf FETCH_HEAD
          git clean -ffdx
      - name: Native Ubuntu verification & host integration
        run: |
          set -eu
          uname -a
          go version
          which fish zsh make git
          go run ./scripts/ci/verify.go --stage=all
          if [ -d internal/host ] && [ -n "$(find internal/host -name '*.go' -print -quit)" ]; then
            go test -tags=integration -race -shuffle=on -count=1 ./internal/host/...
          fi

  freebsd-native:
    needs: linux-fast
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_bsd }}
    runs-on: freebsd-native
    steps:
      - name: Checkout repository (pure git via Forgejo server URL)
        run: |
          set -eu
          SERVER_URL="${GITHUB_SERVER_URL%/}"
          AUTH_URL="$(printf '%s' "$SERVER_URL" | sed -E "s#(https?://)#\\1x-access-token:${GITHUB_TOKEN}@#")"
          trap 'git remote set-url origin "${SERVER_URL}/${GITHUB_REPOSITORY}.git" 2>/dev/null || true' EXIT
          rm -rf .git
          git init -q .
          git remote add origin "${AUTH_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout -qf FETCH_HEAD
          git clean -ffdx
      - name: Native FreeBSD verification (verify.go)
        run: |
          set -eu
          uname -a
          go version
          golangci-lint --version
          go run ./scripts/ci/verify.go --stage=all
